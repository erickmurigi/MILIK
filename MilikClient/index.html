    <!-- Schema: FAQPage — targeting real search queries -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Milik?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik is a cloud-based business management platform built for Kenya. It brings property management, car wash operations, HR, inventory and property sales into one workspace — all sharing a single accounting backbone, user management system and reporting layer."
          }
        },
        {
          "@type": "Question",
          "name": "What modules does Milik include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik includes five modules: Property Management (tenant billing, M-PESA, landlord statements), Car Wash (jobs, payments, loyalty, commissions), Human Resources (payroll, leave, appraisals), Inventory and POS (stock, purchase orders, point of sale) and Property Sales (listings, buyers, agents, deals). Modules are activated based on your business needs."
          }
        },
        {
          "@type": "Question",
          "name": "Does Milik support M-PESA for rent collection?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik integrates with M-PESA Paybill numbers so tenants can pay rent directly. Collections are automatically matched to invoices and receipts are generated instantly, keeping tenant balances accurate without manual entry."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Milik cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik starts at KES 3,500 per month for up to 60 rental units (Launch plan). The Growth plan is KES 7,500/month for 61–250 units and Portfolio Plus is KES 9,000/month for 251–800 units. Enterprise custom pricing is available for 800+ units. Contact Milik for bundle pricing when combining multiple modules."
          }
        },
        {
          "@type": "Question",
          "name": "Does the car wash module support loyalty programs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The car wash module includes a built-in customer loyalty program — track stamps per vehicle plate, set reward thresholds, and send automated SMS notifications when customers earn stamps or unlock rewards."
          }
        },
        {
          "@type": "Question",
          "name": "Can I manage multiple properties and landlords in Milik?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik supports unlimited properties and landlords in a single workspace. You can manage bedsitters, apartments, commercial units and mixed-use portfolios with per-landlord statements and remittances generated automatically."
          }
        },
        {
          "@type": "Question",
          "name": "What financial reports does Milik generate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik generates Trial Balance, Income Statement, Balance Sheet, landlord remittance statements, rental collection reports, aged receivables analysis, paid balance reports and MRI tax summaries — all from the system's accounting core without manual exports."
          }
        },
        {
          "@type": "Question",
          "name": "Does Milik work for bedsitters, apartments and commercial properties?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik handles bedsitters, single-rooms, apartments, commercial units, gated communities and mixed-use properties. It supports multiple unit types, utility billing (water, electricity) and variable charge structures per tenant."
          }
        },
        {
          "@type": "Question",
          "name": "Can multiple users access the same Milik workspace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik supports multiple user accounts per company with role-based access control. You can assign roles like Administrator, Manager, Accountant, Agent and Viewer — each with their own permission levels across modules."
          }
        },
        {
          "@type": "Question",
          "name": "Can I enter my own records during the Milik trial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The demo is read-only so visitors can explore safely without altering the shared demo workspace. Once you subscribe, your own live workspace is provisioned with full access."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the Milik demo last?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Demo access lasts for 3 days from the moment the workspace is activated. You can contact Milik to extend the demo or move directly to a paid subscription."
          }
        }
