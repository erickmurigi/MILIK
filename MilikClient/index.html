    <!-- Schema: FAQPage — targeting real search queries -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Milik property management software?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik is a cloud-based property management system built for Kenya. It automates tenant billing, M-PESA rent collection, landlord statements and financial reporting — Trial Balance, Income Statement and Balance Sheet — all in one workspace. It is used by property managers, agents and landlords across Kenya."
          }
        },
        {
          "@type": "Question",
          "name": "Does Milik support M-PESA for rent collection?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik integrates with M-PESA Paybill numbers so tenants can pay rent directly. Collections are automatically matched to invoices and receipts are generated instantly, keeping tenant balances accurate without manual entry."
          }
        },
        {
          "@type": "Question",
          "name": "How much does property management software cost in Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik starts at KES 3,500 per month for up to 60 units (Launch plan). The Growth plan is KES 7,500/month for 61–250 units and Portfolio Plus is KES 9,000/month for 251–800 units. Enterprise custom pricing is available for portfolios above 800 units."
          }
        },
        {
          "@type": "Question",
          "name": "Can I manage multiple properties and landlords in Milik?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik supports unlimited properties and landlords in a single company workspace. You can manage bedsitters, apartments, commercial units and mixed-use portfolios, with per-landlord statements and remittances generated automatically."
          }
        },
        {
          "@type": "Question",
          "name": "What financial reports does Milik generate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Milik generates Trial Balance, Income Statement, Balance Sheet, landlord remittance statements, rental collection reports, aged receivables analysis, paid balance reports and MRI tax summaries — all directly from the system's accounting core without manual exports."
          }
        },
        {
          "@type": "Question",
          "name": "Does Milik work for bedsitters, apartments and commercial properties?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik handles bedsitters, single-rooms, apartments, commercial units, gated communities and mixed-use properties. It supports multiple unit types, utility billing (water, electricity) and variable charge structures per tenant."
          }
        },
        {
          "@type": "Question",
          "name": "Can multiple users access the same Milik workspace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Milik supports multiple user accounts per company with role-based access control. You can assign roles like Administrator, Manager, Accountant, Agent and Viewer — each with their own permission levels across modules."
          }
        },
        {
          "@type": "Question",
          "name": "Does the demo include accounting reports?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The demo showcases Chart of Accounts, Trial Balance and Income Statement so prospects can see the financial backbone clearly before subscribing."
          }
        },

          "@type": "Question",
          "name": "Can I enter my own records during the Milik trial?",
